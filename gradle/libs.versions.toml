[versions]
# LiteRT-LM 0.18.0이 Kotlin 2.4 메타데이터로 배포돼 2.2.x 컴파일러로는 읽지 못한다(10-30 팀 PC 첫 빌드).
kotlin = "2.4.0"
agp = "8.13.0"
junit = "5.11.4"
kotlinx-serialization = "1.9.0"
kotlinx-coroutines = "1.10.2"
# D38·D40: 0.18.0 고정. latest.release 금지. 10-26 Maven 게시 확인 후 없으면 0.18.1로 교체.
litertlm = "0.18.0"
androidx-core = "1.16.0"
androidx-appcompat = "1.7.1"
# 실험(10-30): 열차 목록 카드 OCR. 번들 모델(네트워크 불필요).
mlkit-text-korean = "16.0.1"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
litertlm-android = { module = "com.google.ai.edge.litertlm:litertlm-android", version.ref = "litertlm" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
mlkit-text-korean = { module = "com.google.mlkit:text-recognition-korean", version.ref = "mlkit-text-korean" }
# 루트 buildscript 클래스패스용 (AGP는 Android SDK가 있을 때만 올린다)
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
